spring.application.name=api-gateway
server.port=8001

# ==============================
# EUREKA
# ==============================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ==============================
# GATEWAY CONFIG
# ==============================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.config.import=optional:configserver:http://localhost:8888

spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=5s

# Seguridad basica
spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.default-filters[1]=RemoveRequestHeader=Set-Cookie

# ==============================
# RUTAS
# ==============================

spring.cloud.gateway.routes[0].id=gestion-medicamentos
spring.cloud.gateway.routes[0].uri=lb://gestion-medicamentos-ws
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/medicamentos/**

spring.cloud.gateway.routes[1].id=medico-service
spring.cloud.gateway.routes[1].uri=lb://medico-service-ws
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/medicos/**

spring.cloud.gateway.routes[2].id=auth-service
spring.cloud.gateway.routes[2].uri=lb://auth-service-ws
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[3].id=paciente-service
spring.cloud.gateway.routes[3].uri=lb://paciente-service-ws
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/pacientes/**

spring.cloud.gateway.routes[4].id=cita-service
spring.cloud.gateway.routes[4].uri=lb://cita-service-ws
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/citas/**

spring.cloud.gateway.routes[5].id=notificaciones-service
spring.cloud.gateway.routes[5].uri=lb://notificaciones-service-ws
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notificaciones/**

spring.cloud.gateway.routes[6].id=reportes-service
spring.cloud.gateway.routes[6].uri=lb://reportes-service-ws
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/reportes/**

# ==============================
# CORS GLOBAL (MUY IMPORTANTE)
# ==============================

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

# ==============================
# ACTUATOR
# ==============================
management.endpoints.web.exposure.include=*
management.endpoint.gateway.enabled=true
management.endpoint.health.show-details=always

# DEBUG (opcional)
logging.level.org.springframework.cloud.gateway=DEBUG