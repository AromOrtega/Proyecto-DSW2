spring.application.name=auth-service-ws
server.port=8083

# --- CONEXION A EUREKA ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# --- BASE DE DATOS (MySQL) ---
spring.datasource.url=jdbc:mysql://localhost:3306/salud?createDatabaseIfNotExist=true
spring.datasource.username=root
# ⚠️ Cambia esta contraseña por la de tu MySQL local:
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / HIBERNATE ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# Clave Base64 de 256 bits (no cambiar en DEV)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
# Expiración 24 horas
jwt.expiration=86400000

# --- ADMIN POR DEFECTO (creado por DataInitializer al arrancar) ---
# username: admin
# password: Admin1234!

# --- LOGGING ---
logging.level.org.springframework.security=DEBUG
logging.level.com.saludvital=DEBUG

spring.cloud.compatibility-verifier.enabled=false
