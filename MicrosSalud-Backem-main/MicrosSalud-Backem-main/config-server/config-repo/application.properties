spring.application.name=global-config
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# --- RABBITMQ (defaults globales, puede sobreescribirse por servicio) ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- JWT (compartido entre todos los microservicios) ---
# Misma clave que auth-service — NO cambiar sin regenerar todos los tokens
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# --- ACTUATOR / PROMETHEUS (globales) ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
