spring.application.name=notificaciones-service-ws
server.port=8091

# --- EUREKA ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# --- BASE DE DATOS ---
spring.datasource.url=jdbc:mysql://localhost:3306/salud?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# --- RABBITMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=salud.exchange
app.rabbitmq.routingKey.notificacion=notificacion.enviada

# Nombres de colas declaradas por este servicio
app.rabbitmq.queue.medico=cola-medico-eventos
app.rabbitmq.queue.paciente=cola-paciente-eventos
app.rabbitmq.queue.cita=cola-cita-eventos
app.rabbitmq.queue.medicamento=cola-medicamento-eventos
app.rabbitmq.queue.reporte=cola-reporte-eventos
app.rabbitmq.queue.notificacion=cola-notificacion-enviada

# --- ACTUATOR / PROMETHEUS ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
