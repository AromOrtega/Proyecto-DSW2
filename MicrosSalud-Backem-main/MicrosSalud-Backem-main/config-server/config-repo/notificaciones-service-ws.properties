spring.application.name=notificaciones-service-ws
server.port=8091

# --- EUREKA ---
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# --- RABBITMQ ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.rabbitmq.exchange=salud.exchange
app.rabbitmq.routingKey.notificacion=notificacion.enviada

# Nombres de colas declaradas por este servicio
app.rabbitmq.queue.medico=cola-medico-eventos
app.rabbitmq.queue.paciente=cola-paciente-eventos
app.rabbitmq.queue.cita=cola-cita-eventos
app.rabbitmq.queue.medicamento=cola-medicamento-eventos
app.rabbitmq.queue.reporte=cola-reporte-eventos
app.rabbitmq.queue.notificacion=cola-notificacion-enviada

# --- ACTUATOR / PROMETHEUS ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
