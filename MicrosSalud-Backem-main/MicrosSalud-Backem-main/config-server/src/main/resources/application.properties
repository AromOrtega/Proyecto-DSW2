spring.application.name=config-server-ws
server.port=8888

# ─── config-repo nativo: ruta relativa a la carpeta donde se ejecuta el jar ───
# Esta ruta apunta a config-server/config-repo dentro de tu proyecto
spring.cloud.config.server.native.search-locations=classpath:/config-repo,\
  file:./config-repo,\
  file:../config-server/config-repo

spring.profiles.active=native