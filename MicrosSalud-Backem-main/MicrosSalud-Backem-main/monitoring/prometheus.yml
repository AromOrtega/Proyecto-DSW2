global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "api-gateway"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8080"]

  - job_name: "medico-service-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8082"]

  - job_name: "paciente-service-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8086"]

  - job_name: "gestion-medicamentos-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8081"]

  - job_name: "cita-service-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8010"]

  - job_name: "reportes-service-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8090"]

  - job_name: "notificaciones-service-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8091"]

  - job_name: "auth-service-ws"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["localhost:8083"]
